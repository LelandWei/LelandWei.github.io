<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a href="{{ '/' | relative_url }}#research">Research</a>
          <a href="{{ '/' | relative_url }}#publications">Publications</a>
          <a href="{{ '/cv/' | relative_url }}">CV</a>
          <a href="{{ '/' | relative_url }}#contact">Contact</a>
        </div>
      </nav>
    </header>

    <main class="page-shell">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ 'now' | date: '%Y' }} Dongyu (Leland) Wei. Built with Jekyll.</p>
    </footer>
  </body>
</html>
